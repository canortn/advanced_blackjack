<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Blackjack</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom right, #1f2f2f, #3a5a5a);
            color: #ffffff;
            font-family: 'Roboto Slab', serif;
            text-align: center;
            padding: 30px;
        }
        h1 {
            font-size: 50px;
            color: gold;
            margin-bottom: 30px;
        }
        label, input {
            font-size: 20px;
            margin: 10px;
        }
        button {
            background-color: gold;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Welcome to Blackjack</h1>
    <form method="POST">
        <label for="num_decks">Select number of decks (1–8):</label>
        <input type="number" name="num_decks" min="1" max="8" required><br>
        <button type="submit">Continue</button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Place Your Bet</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom right, #2f1e2f, #5a3a5a);
            color: #ffffff;
            font-family: 'Roboto Slab', serif;
            text-align: center;
            padding: 30px;
        }
        h1 {
            font-size: 48px;
            color: gold;
            margin-bottom: 20px;
        }
        label, input {
            font-size: 20px;
            margin: 10px;
        }
        button {
            background-color: gold;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Place Your Bet</h1>
    <form method="POST">
        <label for="bet">Enter Bet Amount:</label>
        <input type="number" name="bet" min="1" max="1000" required><br>
        <button type="submit">Start Game</button>
    </form>
    {% if error %}
        <p style="color: red; font-size: 18px;">{{ error }}</p>
    {% endif %}
    <p>Current Balance: {{ balance }}</p>
</body>
</html>

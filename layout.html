<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blackjack</title>
    <style>
        body {
            background: linear-gradient(to bottom right, #1e1e2f, #3c3c5c);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        h1, h2 {
            color: #FFD700;
        }
        .card-box {
            background-color: #222;
            padding: 15px;
            margin: 10px auto;
            border-radius: 12px;
            width: fit-content;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        input, button {
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 18px;
        }
        button {
            background-color: #FFD700;
            color: black;
            cursor: pointer;
            margin-left: 12px;
        }
        .credit {
            position: fixed;
            bottom: 8px;
            left: 8px;
            font-size: 20px;
            color: #aaa;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    <div class="credit">Made by Can Ortanç & ChatGPT</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Place Your Bet</title>
    <style>
        body {
            background-color: #2b2b3d;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        input[type="number"] {
            padding: 10px;
            font-size: 18px;
            width: 120px;
            border-radius: 6px;
            border: none;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #d35400;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Place Your Bet</h1>
    <h2>Your Balance: ${{ balance }}</h2>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label for="bet">Enter Bet Amount:</label>
        <br><br>
        <input type="number" name="bet" min="1" required>
        <br><br>
        <button type="submit">Deal Cards</button>
    </form>
</body>
</html>

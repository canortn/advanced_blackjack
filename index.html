<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blackjack - Choose Decks</title>
    <style>
        body {
            background-color: #1f1f2e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        input[type="number"] {
            padding: 10px;
            font-size: 18px;
            width: 80px;
            border-radius: 6px;
            border: none;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Welcome to Blackjack</h1>
    <form method="POST" action="/setup">
        <label for="num_decks">Number of Decks (1-8):</label>
        <br><br>
        <input type="number" name="num_decks" min="1" max="8" value="1" required>
        <br><br>
        <button type="submit">Start Game</button>
    </form>
</body>
</html>

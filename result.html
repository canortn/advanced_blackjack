<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blackjack Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(to right, #232526, #414345);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        .result-box {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 600px;
        }
        .card {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background-color: white;
            color: black;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px;
        }
        .btn {
            background-color: #2196F3;
            color: white;
            padding: 12px 28px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0b7dda;
        }
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="result-box">
        <h2>{{ outcome }}</h2>
        <p>Balance: ${{ balance }}</p>

        <h2 class="section-title">Your Hand ({{ player_total }})</h2>
        {% for card in player_hand %}
            <div class="card">{{ card }}</div>
        {% endfor %}

        <h2 class="section-title">Dealer's Hand ({{ dealer_total }})</h2>
        {% for card in dealer_hand %}
            <div class="card">{{ card }}</div>
        {% endfor %}

        <form action="/restart">
            <button class="btn">Play Again</button>
        </form>
    </div>
</body>
</html>
